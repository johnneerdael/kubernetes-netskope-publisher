{{- if and (not (include "kubernetes-netskope-publisher.isApiEnrollment" .)) (not .Values.registrationToken.existingSecret) (or .Values.registrationToken.value .Values.registrationToken.tokens) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubernetes-netskope-publisher.fullname" . }}-token
  labels:
    {{- include "kubernetes-netskope-publisher.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq (include "kubernetes-netskope-publisher.tokenKeyBy" .) "single" }}
  token: {{ .Values.registrationToken.value | quote }}
  {{- else }}
  {{- range $key, $token := .Values.registrationToken.tokens }}
  {{ $key | toString | quote }}: {{ $token | quote }}
  {{- end }}
  {{- end }}
{{- end }}
