apiVersion: v2
name: kubernetes-netskope-publisher
description: Netskope Private Access Publisher for Kubernetes
type: application
version: 1.6.0
appVersion: "1.0.0"
kubeVersion: ">=1.27.0-0"
keywords:
  - netskope
  - npa
  - publisher
  - private-access
  - zero-trust
  - sase
  - ztna
home: https://johnneerdael.github.io/kubernetes-netskope-publisher
sources:
  - https://github.com/johnneerdael/kubernetes-netskope-publisher
maintainers:
  - name: John Neerdael
    email: john@neerdael.nl
    url: https://github.com/johnneerdael
icon: https://johnneerdael.github.io/kubernetes-netskope-publisher/images/netskope-favicon-192x192.png
annotations:
  # See https://artifacthub.io/docs/topics/annotations/helm/
  artifacthub.io/category: networking
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://johnneerdael.github.io/kubernetes-netskope-publisher
    - name: Source
      url: https://github.com/johnneerdael/kubernetes-netskope-publisher
  artifacthub.io/maintainers: |
    - name: John Neerdael
      email: john@neerdael.nl
  artifacthub.io/changes: |
    - kind: added
      description: Token mode now supports StatefulSets with one pre-provisioned registration token per replica (registrationToken.keyBy=ordinal), for tokens issued by the Netskope Terraform provider without any API credential in the cluster.
      links:
        - name: Customer guide
          url: https://johnneerdael.github.io/kubernetes-netskope-publisher/admin/how-to/terraform-replicas/
    - kind: added
      description: registrationToken.keyBy=node lets a DaemonSet pick a per-node token; registrationToken.tokens provides a chart-managed key to token map.
    - kind: added
      description: Token enrollment is idempotent. It skips enrollment when persisted state matches the token fingerprint and re-enrolls when a new token is delivered.
    - kind: added
      description: persistence.type=hostPath for per-node DaemonSet state.
    - kind: changed
      description: StatefulSet persistence now uses volumeClaimTemplates (one PVC per replica). Existing StatefulSets with persistence must be deleted with --cascade=orphan before upgrading.
